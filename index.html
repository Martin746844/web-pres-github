<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Můj první web</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            margin-top: 150px;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 20px;
            color: #aaa;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🚀 Ahoj!</h1>

        <p>Tohle je můj první web na GitHubu.</p>

        <button onclick="pozdrav()">
            Klikni na mě
        </button>
    </div>

    <script>
        function pozdrav() {
            alert("Funguje to! 🎉");
        }
    </script>

</body>
</html>
